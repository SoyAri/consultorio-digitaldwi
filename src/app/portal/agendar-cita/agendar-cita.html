<div class="min-h-screen bg-gray-50">

  <!-- Header -->
  <header class="bg-white border-b border-gray-200 px-6 py-4 flex items-center gap-3">
    <button routerLink="/portal" class="text-gray-400 hover:text-gray-600 transition-colors" aria-label="Volver al portal">
      <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div>
      <p class="text-sm font-medium text-gray-900">Agendar nueva cita</p>
      <p class="text-xs text-gray-500">Elige un doctor, fecha y horario disponible</p>
    </div>
  </header>

  <main class="max-w-lg mx-auto px-4 py-8">
    <div class="bg-white rounded-2xl border border-gray-100 p-6">

      @if (loadingDoctor()) {
        <div class="flex items-center justify-center py-10">
          <div class="w-6 h-6 border-2 border-teal-600 border-t-transparent rounded-full animate-spin"></div>
        </div>
      } @else if (noAssignedDoctor()) {
        <div class="text-center py-6">
          <p class="text-gray-900 font-medium mb-1">Aún no tienes un doctor asignado</p>
          <p class="text-sm text-gray-500">Contacta a recepción para agendar tu primera cita.</p>
        </div>
      } @else {
        <app-doctor-date-slot-picker
          [doctors]="doctors()"
          [availableSlots]="availableSlots()"
          [loadingSlots]="loadingSlots()"
          [submitting]="submitting()"
          [errorMessage]="errorMessage()"
          (doctorChange)="onDoctorChange($event)"
          (dateChange)="onDateChange($event)"
          (confirm)="onConfirm($event)" />
      }

    </div>
  </main>

</div>
