<div class="min-h-screen bg-gray-50 dark:bg-slate-900"
     [class.a11y-contrast]="a11y.prefs().highContrast"
     [class.a11y-underline]="a11y.prefs().underlineLinks"
     [class.a11y-dyslexia]="a11y.prefs().dyslexiaFont"
     [class.a11y-spacing]="a11y.prefs().textSpacing"
     [class.a11y-reduce-motion]="a11y.prefs().reduceMotion"
     [style.zoom]="a11y.prefs().fontScale">

  <!-- Header -->
  <header class="bg-white dark:bg-slate-900 border-b border-gray-200 dark:border-slate-700 px-6 py-4 flex items-center gap-3">
    <button routerLink="/portal" class="text-gray-400 dark:text-slate-500 hover:text-gray-600 dark:hover:text-slate-300 transition-colors" aria-label="Volver al portal">
      <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div class="flex-1">
      <p class="text-sm font-medium text-gray-900 dark:text-slate-100">Agendar nueva cita</p>
      <p class="text-xs text-gray-500 dark:text-slate-400">Elige un doctor, fecha y horario disponible</p>
    </div>
    <app-theme-toggle />
  </header>

  <main class="max-w-lg mx-auto px-4 py-8">
    <div class="bg-white dark:bg-slate-800 rounded-2xl border border-gray-100 dark:border-slate-700 p-6">

      @if (loadingDoctor()) {
        <div class="flex items-center justify-center py-10">
          <div class="w-6 h-6 border-2 border-teal-600 border-t-transparent rounded-full animate-spin"></div>
        </div>
      } @else if (noAssignedDoctor()) {
        <div class="text-center py-6">
          <p class="text-gray-900 dark:text-slate-100 font-medium mb-1">Aún no tienes un doctor asignado</p>
          <p class="text-sm text-gray-500 dark:text-slate-400">Contacta a recepción para agendar tu primera cita.</p>
        </div>
      } @else {
        <app-doctor-date-slot-picker
          [doctors]="doctors()"
          [availableSlots]="availableSlots()"
          [loadingSlots]="loadingSlots()"
          [submitting]="submitting()"
          [errorMessage]="errorMessage()"
          (doctorChange)="onDoctorChange($event)"
          (dateChange)="onDateChange($event)"
          (confirm)="onConfirm($event)" />
      }

    </div>
  </main>

  <app-accessibility-widget />
</div>
