<div class="modal-backdrop" (click)="close()">
  <div class="modal" (click)="$event.stopPropagation()">

    <!-- Header -->
    <div class="modal__header">
      <div class="modal__header-left">
        <div class="modal__header-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        </div>
        <div>
          <h2 class="modal__title">{{ title }}</h2>
          <p class="modal__subtitle">Define un rango de horas disponibles para agendar</p>
        </div>
      </div>
      <button class="modal__close" (click)="close()" type="button" aria-label="Cerrar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <!-- Body -->
    <form class="modal__body" (ngSubmit)="submit()">
      <div class="form-section">

        <!-- Día de la semana -->
        <div class="form-group">
          <label class="form-label">Día de la semana <span class="required">*</span></label>
          <div class="day-selector">
            @for (day of days; track day.value) {
              <button
                type="button"
                class="day-btn"
                [class.day-btn--active]="form.day_of_week === day.value"
                (click)="setDay(day.value)">
                {{ day.label.slice(0, 3) }}
              </button>
            }
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Hora inicio <span class="required">*</span></label>
            <input class="form-input" type="time" [(ngModel)]="form.start_time" name="start_time" required />
          </div>
          <div class="form-group">
            <label class="form-label">Hora fin <span class="required">*</span></label>
            <input class="form-input" type="time" [(ngModel)]="form.end_time" name="end_time" required />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Duración de cada cita</label>
          <select class="form-input" [(ngModel)]="form.slot_duration_minutes" name="slot_duration_minutes">
            @for (d of durations; track d) {
              <option [value]="d">{{ d }} minutos</option>
            }
          </select>
        </div>

        <label class="toggle-row">
          <input type="checkbox" [(ngModel)]="form.active" name="active" />
          <span>Bloque activo (visible para agendamiento de pacientes)</span>
        </label>

        @if (error) {
          <p class="form-error">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            {{ error }}
          </p>
        }

      </div>
    </form>

    <!-- Footer -->
    <div class="modal__footer">
      <span></span>
      <div class="footer-actions">
        <button class="btn btn--ghost" type="button" (click)="close()">Cancelar</button>
        <button class="btn btn--primary" type="button" (click)="submit()">
          {{ isCreate ? 'Agregar bloque' : 'Guardar cambios' }}
        </button>
      </div>
    </div>

  </div>
</div>
